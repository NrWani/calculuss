<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Integral Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 350px; }
        input { width: 100%; margin: 10px 0; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Integral Calculator</h2>
    <label>Function f(x):</label>
    <input type="text" id="func" placeholder="e.g., x^2 + 2*x">
    
    <label>Lower Limit (a):</label>
    <input type="number" id="lower" value="0">
    
    <label>Upper Limit (b):</label>
    <input type="number" id="upper" value="1">
    
    <button onclick="calculate()">Calculate</button>
    
    <div id="result">Result: -</div>
</div>

<script>
    function calculate() {
        const expression = document.getElementById('func').value;
        const a = parseFloat(document.getElementById('lower').value);
        const b = parseFloat(document.getElementById('upper').value);
        const resDiv = document.getElementById('result');

        try {
            // math.js derivative/integration parsing
            const f = math.parse(expression).compile();
            const scope = { x: 0 };
            
            // Numerical integration using Simpson's rule or similar logic
            // math.js 'integral' is symbolic, but for simple web use:
            const result = math.integrate(expression, 'x', a, b);
            
            resDiv.innerText = "Result: " + result;
        } catch (err) {
            resDiv.innerText = "Error: Check your function syntax.";
        }
    }
</script>

</body>
</html>
